<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HÜİST Stant Oyunları</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Moderatör Reset Butonu -->
    <button class="mod-reset-btn" id="btnReset" onclick="GameApp.resetToMenu()">🔄 Başa Dön</button>

    <!-- 1. Ana Menü Ekranı -->
    <div id="screen-menu" class="screen active">
        <h1>HÜİST'e Hoş Geldin!</h1>
        <h2>TRUTH or LIE</h2>
        <p>Bilgini test et, ödülleri kazan.</p>
        <button class="btn-primary" onclick="GameApp.startGame()">Oyuna Başla</button>
    </div>

    <!-- 2. Oyun Ekranı (Truth or Lie) -->
    <div id="screen-game" class="screen">
        <div class="timer-text" id="timerText">Kalan Süre: 60s</div>
        <div class="timer-container">
            <div class="timer-bar" id="timerBar"></div>
        </div>
        
        <h2 id="questionText">Soru metni buraya gelecek...</h2>
        
        <div class="btn-container">
            <button class="btn-true" id="btnTrue" onclick="GameApp.handleAnswer(true)">Gerçek</button>
            <button class="btn-false" id="btnFalse" onclick="GameApp.handleAnswer(false)">Yalan</button>
        </div>

        <div class="feedback-box" id="feedbackBox">
            <!-- Fact / Açıklama buraya gelecek -->
        </div>
    </div>

    <!-- 3. Sonuç Ekranı -->
    <div id="screen-result" class="screen">
        <h1 id="resultTitle">Oyun Bitti!</h1>
        <p id="resultScore">5 üzerinden 3 doğru yaptın.</p>
        
        <div id="resultActionContainer" style="margin-top:20px;">
            <!-- Çark butonu veya yeniden oyna butonu buraya eklenecek -->
        </div>
    </div>

    <!-- 4. Çark Ekranı -->
    <div id="screen-wheel" class="screen">
        <h1>Ödülünü Belirle!</h1>
        <div id="wheelContainer">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>
        <button class="btn-primary" id="btnSpin" onclick="GameApp.spinWheel()">Çarkı Çevir</button>
        <div class="prize-result" id="prizeResult"></div>
        <button class="btn-primary" id="btnFinish" style="display:none; margin-top:20px;" onclick="GameApp.resetToMenu()">Tamamla</button>
    </div>

    <!-- Script Yüklemeleri (Sıra Önemli) -->
    <script src="data/questions.js"></script>
    <script src="components/wheel.js"></script>
    <script src="script.js"></script>
</body>
</html>
